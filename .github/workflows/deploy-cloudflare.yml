name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.filter.outputs.accounts }}
      auth: ${{ steps.filter.outputs.auth }}
      inbox: ${{ steps.filter.outputs.inbox }}
      console: ${{ steps.filter.outputs.console }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            accounts:
              - 'packages/accounts/**'
              - 'packages/app-preset/**'
              - 'packages/bloom/**'
              - 'packages/expo-splash/**'
              - 'packages/core/**'
              - 'packages/protocol/**'
              - 'packages/services/**'
              - 'packages/contracts/**'
            auth:
              - 'packages/auth/**'
              - 'packages/app-preset/**'
              - 'packages/bloom/**'
              - 'packages/core/**'
              - 'packages/protocol/**'
              - 'packages/services/**'
              - 'packages/contracts/**'
            inbox:
              - 'packages/inbox/**'
              - 'packages/app-preset/**'
              - 'packages/bloom/**'
              - 'packages/expo-splash/**'
              - 'packages/core/**'
              - 'packages/protocol/**'
              - 'packages/services/**'
              - 'packages/contracts/**'
            console:
              - 'packages/console/**'
              - 'packages/app-preset/**'
              - 'packages/bloom/**'
              - 'packages/core/**'
              - 'packages/protocol/**'
              - 'packages/services/**'
              - 'packages/contracts/**'

  deploy-auth:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      # bun 1.3.14 `--frozen-lockfile` false-positives on a perfectly-synced
      # lock (non-deterministic configVersion churn), failing deploys. Lockfile
      # sync is already gated pre-push (test-build) and in PR CI, so the deploy
      # installs without the buggy frozen flag.
      - run: bun install
      # Build the Vite SPA into packages/auth/dist. Post-2c the IdP is a
      # PURE-STATIC SPA: the former `/api/device-accounts` Pages Function was
      # deleted when the IdP moved to the device-first SDK (zero-cookie chooser
      # via useSwitchableAccounts), so there is no `functions/` directory left
      # to compile or deploy.
      - run: bun x turbo run build --filter=auth
        env:
          # Auth IdP's OWN registered Oxy client id. `packages/auth/lib/oxy-client.ts`
          # falls back to a committed id when this is unset. A repo VARIABLE rather
          # than a secret — the id ships inside the bundle. Named per APP because
          # auth and console share `VITE_OXY_CLIENT_ID`.
          VITE_OXY_CLIENT_ID: ${{ vars.AUTH_OXY_CLIENT_ID }}
      # Deploy the static `dist`. Invoke `bunx wrangler` DIRECTLY rather than
      # cloudflare/wrangler-action: that action's `npx --no-install wrangler`
      # path runs npm's Arborist from packages/auth, which rejects the repo-root
      # `overrides["@oxyhq/bloom"]` against this package's newer direct bloom dep
      # (`npm error code EOVERRIDE`). The whole monorepo installs with bun, and
      # bun's resolver does not perform that npm-only override validation.
      - name: Deploy to Cloudflare Pages
        working-directory: packages/auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy dist --project-name=oxy-auth --branch=main
      # Post-deploy smoke gate: hit the LIVE host and assert the device-first IdP
      # contract on PUBLIC, unauthenticated endpoints only (no secrets). A broken
      # deploy (blank SPA, or a re-added FedCM manifest / oxy_device cookie lane)
      # turns this job RED immediately. Retries briefly to let the Pages deploy
      # propagate.
      - name: Post-deploy IdP smoke gate
        working-directory: packages/auth
        env:
          SMOKE_TARGET: https://auth.oxy.so
        run: |
          for attempt in 1 2 3 4 5; do
            echo "::group::IdP smoke attempt ${attempt}/5"
            if bun run smoke:idp; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -lt 5 ]; then
              echo "Smoke gate failed (edge may still be propagating); retrying in 15s..."
              sleep 15
            fi
          done
          echo "::error::IdP post-deploy smoke gate failed — auth.oxy.so is serving a broken build"
          exit 1

  deploy-accounts:
    needs: detect-changes
    if: needs.detect-changes.outputs.accounts == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      # bun 1.3.14 `--frozen-lockfile` false-positives on a perfectly-synced
      # lock (non-deterministic configVersion churn), failing deploys. Lockfile
      # sync is already gated pre-push (test-build) and in PR CI, so the deploy
      # installs without the buggy frozen flag.
      - run: bun install
      - run: bun x turbo run build --filter=accounts
        env:
          # Accounts' PRODUCTION Oxy client id. `packages/accounts/constants/oxy.ts`
          # falls back to a committed id when this is unset. A repo VARIABLE rather
          # than a secret — the id ships inside the bundle. Named per APP because
          # accounts, commons, and inbox share `EXPO_PUBLIC_OXY_CLIENT_ID`.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.ACCOUNTS_OXY_CLIENT_ID }}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy packages/accounts/dist --project-name=oxy-accounts --branch=main

  deploy-inbox:
    needs: detect-changes
    if: needs.detect-changes.outputs.inbox == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      # bun 1.3.14 `--frozen-lockfile` false-positives on a perfectly-synced
      # lock (non-deterministic configVersion churn), failing deploys. Lockfile
      # sync is already gated pre-push (test-build) and in PR CI, so the deploy
      # installs without the buggy frozen flag.
      - run: bun install
      - run: bun x turbo run build --filter=inbox
        env:
          # Inbox's PRODUCTION Oxy client id. `packages/inbox/constants/oxy.ts`
          # falls back to a committed id when this is unset, so nothing errors —
          # the deployed bundle just authenticates against the wrong Oxy
          # application. A repo VARIABLE rather than a secret: the id travels
          # inside the bundle, so it is public by construction, and a secret
          # would only make it unreadable in the UI. The variable is named per
          # APP because five apps in this monorepo share two env-var names —
          # EXPO_PUBLIC_OXY_CLIENT_ID (accounts, commons, inbox) and
          # VITE_OXY_CLIENT_ID (console, auth) — so one variable per var name
          # could not serve them.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.INBOX_OXY_CLIENT_ID }}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy packages/inbox/dist --project-name=oxy-inbox --branch=main

  deploy-console:
    needs: detect-changes
    if: needs.detect-changes.outputs.console == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      # bun 1.3.14 `--frozen-lockfile` false-positives on a perfectly-synced
      # lock (non-deterministic configVersion churn), failing deploys. Lockfile
      # sync is already gated pre-push (test-build) and in PR CI, so the deploy
      # installs without the buggy frozen flag.
      - run: bun install
      - run: bun x turbo run build --filter=oxy-console
        env:
          # Console's PRODUCTION Oxy client id. `packages/console/src/lib/config.ts`
          # falls back to a committed id when this is unset. A repo VARIABLE rather
          # than a secret — the id ships inside the bundle. Named per APP because
          # auth and console share `VITE_OXY_CLIENT_ID`.
          VITE_OXY_CLIENT_ID: ${{ vars.CONSOLE_OXY_CLIENT_ID }}
      - name: Resolve build output directory
        run: |
          if [ -d packages/console/dist ]; then
            echo "DEPLOY_DIR=packages/console/dist" >> $GITHUB_ENV
          elif [ -d packages/console/.output/public ]; then
            echo "DEPLOY_DIR=packages/console/.output/public" >> $GITHUB_ENV
          else
            echo "No build output found" && exit 1
          fi
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy ${{ env.DEPLOY_DIR }} --project-name=oxy-console --branch=main
